<template>
    <lightning-card title="Invoices" icon-name="standard:document">
        <div class="slds-p-around_medium">
            <table class="slds-table slds-table_bordered">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Invoice ID</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={invoices} for:item="invoice">
                        <tr key={invoice.id}>
                            <td>{invoice.date}</td>
                            <td>{invoice.invoiceId}</td>
                            <td>
                                <template if:true={invoice.isAvailable}>
                                    <lightning-button-icon
                                        icon-name="utility:download"
                                        alternative-text="Download"
                                        onclick={handleDownload}
                                        data-id={invoice.invoiceId}
                                    ></lightning-button-icon>
                                </template>
                                <template if:false={invoice.isAvailable}>
                                    Not Available
                                </template>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </lightning-card>
</template>
